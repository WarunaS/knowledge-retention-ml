[project]
name = "knowledge-retention-ml"
version = "0.1.0"
description = "Classify organisational knowledge in developer–LLM conversations by technical domain and knowledge type"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "datasets>=2.18",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Stage 3: clean / prepare
clean = ["datasketch>=1.6", "langdetect>=1.0.9"]
# Stage 4: explore
explore = ["bertopic>=0.16", "matplotlib>=3.8", "seaborn>=0.13"]
# Stage 4b: label (weak labels and the teacher run with Claude)
label = ["anthropic>=2.8"]
# Stages 5-12: features, models, evaluation
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "sentence-transformers>=2.6",
    "transformers>=4.40",
    "torch>=2.2",
    "setfit>=1.0",
    "sentencepiece>=0.2",   # DeBERTa-v3 tokenizer
    "protobuf>=4.0",        # needed by transformers to read the sentencepiece model
]
# Application plane (after stage 14): extraction, storage, retrieval, agent
app = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "networkx>=3.2", "mcp>=2.3", "anthropic>=2.8"]   # vectors: exact numpy search, no vector DB needed at this scale
# Optional demo: one-screen Streamlit dashboard (Ask, Handover pack, Knowledge map, Model results)
dashboard = ["streamlit>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: needs internet access to the real datasets (run with -m network)",
    "slow: downloads a model or does heavy compute (run with -m slow)",
]
addopts = "-m 'not network and not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"
