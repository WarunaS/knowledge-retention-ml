# Stage 4b - labelling. Order: gold ids -> rater sheets -> training pool -> LLM weak labels -> noise check.
codebook_version: v1

gold:
  n_segments: 400
  allocation: equal          # same share per source, so every source can be scored on its own
  seed: 42
  kappa_threshold: 0.6       # below this: revise the codebook and relabel once (report both)

pool:
  n_segments: 10000
  allocation: equal          # excludes every conversation that has a gold segment
  seed: 42

llm:
  provider: anthropic
  model: claude-opus-5-5     # also the teacher model T
  effort: low                # classification; raise only if the noise check shows it is needed
  max_tokens: 4096           # thinking is always on for this model, so leave room above the JSON
  mode: batch                # batch = Message Batches API at 50% price (weak labels); sync for teacher run T
  batch_chunk: 5000
  workers: 4                 # sync mode threads
  max_retries: 4
  fallbacks: true            # sync only: server-side refusal fallback (batch requests cannot use it)
  prices:                    # $ per million tokens, claude-opus-5-5 (from the Claude API docs, 3 Nov 2026 - recheck before a run)
    input: 4.0
    output: 20.0
    cache_read: 0.20
    cache_write: 5.0         # 5-minute cache write = 1.25 x input

noise_check_sample: 100
