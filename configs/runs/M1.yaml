run_id: M1
model: deberta
purpose: Main model - DeBERTa-v3-small fine-tuned on weak labels, two multi-label heads
hypothesis: H1, H2
base_model: microsoft/deberta-v3-small
with_context: true
max_length: 512          # context is cut first, the segment is kept
epochs: 3
lr: 3.0e-5
batch_size: 16
warmup: 0.06
weight_decay: 0.01
dropout: 0.1
pos_weight: true         # rare labels weigh more (capped)
pos_weight_cap: 10.0
fp16: true               # on GPU
save_model: true
seed: 42
